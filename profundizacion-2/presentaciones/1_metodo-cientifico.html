<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El método científico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1420; --cream:#F2EBDD; --amber:#F5A524;
    --leaf:#5FC594; --leaf-dim:#4A7461; --slate:#63788F; --water:#7FC9D9;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--navy);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  #deck{width:100vw;height:100vh}
  .scene{width:100vw;height:100vh;display:none;cursor:pointer}
  .scene.active{display:block}

  /* ---------- tipografía de la escena ---------- */
  .term{font-size:42px;font-weight:600;letter-spacing:.15em;fill:var(--cream);text-transform:uppercase}
  .sup{font-size:11px;letter-spacing:.34em;fill:var(--slate);text-transform:uppercase}
  .term-rule{stroke:var(--amber);stroke-width:2.5}
  .kw{font-size:19px;font-weight:600;letter-spacing:.32em;fill:var(--amber);text-transform:uppercase;
      opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
  .kw.on{opacity:1;transform:none}
  .tag{font-size:10.5px;letter-spacing:.22em;fill:var(--slate);text-transform:uppercase}
  .tag.hot{fill:var(--amber)}
  .tag.ok{fill:var(--leaf)}
  .tag.ink{fill:var(--cream)}
  .val{font-size:11px;letter-spacing:.1em;fill:var(--slate)}
  .line{font-size:15px;letter-spacing:.05em;fill:var(--cream)}
  .line.dim{fill:var(--slate)}
  .big{font-size:26px;letter-spacing:.06em;fill:var(--slate)}
  .qbig{font-size:17px;letter-spacing:.05em;fill:var(--cream)}
  .tick{fill:var(--slate);opacity:.3;transition:opacity .5s,fill .5s}
  .tick.on{fill:var(--amber);opacity:1}
  .pager{font-size:10px;letter-spacing:.24em;fill:var(--slate);opacity:.75}

  /* ---------- utilidades de estado ---------- */
  .fade{opacity:0;transition:opacity 1.3s ease}
  .fade.on{opacity:1}
  .dim,.fade.on.dim{opacity:.2;transition:opacity 1s ease}
  .mov{transition:transform 3.2s cubic-bezier(.45,.05,.35,1)}
  .mov2{transition:transform 1.6s cubic-bezier(.3,.1,.3,1)}
  .draw{stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);
        transition:stroke-dashoffset 3.4s cubic-bezier(.4,0,.3,1)}
  .draw.on{stroke-dashoffset:0}

  /* ---------- bucles lentos y permanentes ---------- */
  .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
  .glow{animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.30}50%{opacity:1}}
  .drift{animation:drift 34s linear infinite}
  @keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
  .qmark{transform-box:fill-box;transform-origin:50% 100%;animation:qm 5.2s ease-in-out infinite}
  @keyframes qm{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-7px);opacity:1}}
  .travel{animation:travel 4.6s ease-in-out infinite}
  @keyframes travel{0%{transform:translateX(0);opacity:0}
    12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--tx,80px));opacity:0}}
  .scan{animation:scan 5.6s ease-in-out infinite}
  @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.9}
    90%{opacity:.9}100%{transform:translateX(var(--tx,240px));opacity:0}}
  .ping{animation:ping 2.4s ease-out infinite}
  @keyframes ping{0%{transform:translate(0,0) scale(.4);opacity:0}
    18%{opacity:.95}100%{transform:translate(-15px,-26px) scale(1.15);opacity:0}}
  .spin{animation:spin 3.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- personaje ---------- */
  .ink{fill:none;stroke:var(--cream);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .coat{fill:#16243A;stroke:var(--cream);stroke-width:2.4;stroke-linejoin:round}
  .sci{transition:transform 3.4s cubic-bezier(.42,0,.58,1)}
  .legL,.legR,.armFree,.armTool,.torso{transform-box:fill-box}
  .legL,.legR{transform-origin:50% 0%}
  .armFree{transform-origin:90% 5%}
  .armTool{transform-origin:8% 6%;transform:rotate(14deg);
           transition:transform 2.2s cubic-bezier(.35,.8,.25,1)}
  .armTool.up{transform:rotate(-30deg)}
  .torso{transform-origin:50% 100%}
  .sci.walking .legL{animation:stepA .92s ease-in-out infinite}
  .sci.walking .legR{animation:stepB .92s ease-in-out infinite}
  .sci.walking .armFree{animation:swing .92s ease-in-out infinite}
  .sci.walking .torso{animation:bob .46s ease-in-out infinite}
  .sci:not(.walking) .torso{animation:breathe 6s ease-in-out infinite}
  @keyframes stepA{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
  @keyframes stepB{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
  @keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}
  .tool{fill:#16243A;stroke:var(--amber);stroke-width:2.2;stroke-linejoin:round}
  .toolG{transform-box:fill-box;transform-origin:70% 60%;
         transition:transform 2.2s cubic-bezier(.35,.8,.25,1)}

  /* ---------- estudiante y pupitre ---------- */
  .stu{transition:transform 3s cubic-bezier(.45,.05,.35,1)}
  .stu .torso{transform-box:fill-box;transform-origin:50% 100%;
              animation:breathe 6s ease-in-out infinite}
  .desk{fill:#1E2E45}
  .deskleg{fill:none;stroke:#2A3C58;stroke-width:2}
  .sheet{fill:var(--cream);opacity:.72}
  .sheetHot{fill:var(--amber);opacity:.9}
  .meter{fill:#22344B}
  .meterFill{transform-box:fill-box;transform-origin:0% 50%;fill:var(--leaf);
             transition:transform 1.4s ease,fill 1.4s ease}
  .shade{fill:#050B13;opacity:.55}

  /* ---------- elementos gráficos ---------- */
  .axis{stroke:var(--slate);stroke-width:1.4}
  .guide{stroke:var(--slate);stroke-width:1;stroke-dasharray:3 6;opacity:.6}
  .bracket{fill:none;stroke:var(--amber);stroke-width:1.8}
  .dlt{font-size:19px;fill:var(--amber);font-weight:600}
  .dot{fill:var(--leaf)}
  .dotHot{fill:var(--amber)}
  .tile{fill:#1B2C44;stroke:var(--cream);stroke-width:2}
  .tileHot{fill:#2A2013;stroke:var(--amber);stroke-width:2}
  .arrow{fill:none;stroke:var(--amber);stroke-width:2.2}
  .arrowDim{fill:none;stroke:var(--slate);stroke-width:1.8}
  .blocked{fill:none;stroke:var(--slate);stroke-width:1.6;stroke-dasharray:4 5}
  .cone{fill:var(--amber);opacity:.05}
  .future{stroke:var(--amber);stroke-width:2;stroke-dasharray:7 7;fill:none}
  .box{fill:none;stroke:var(--slate);stroke-width:1.4;stroke-dasharray:8 9}
  .panel{fill:#101E30;stroke:#1D3049}
  .fog{fill:#16263C;opacity:.5}
  .err{fill:none;stroke:var(--amber);stroke-width:1.6}

  .ui{position:fixed;bottom:20px;right:24px;display:flex;gap:8px;
      opacity:0;pointer-events:none;transition:opacity .4s ease}
  body.show-ui .ui{opacity:1;pointer-events:auto}
  .ui button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--slate);background:transparent;border:1px solid #1D3049;border-radius:2px;
    padding:8px 11px;cursor:pointer;transition:color .2s,border-color .2s}
  .ui button:hover{color:var(--amber);border-color:var(--amber)}
  .ui button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important;animation:none !important}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="ui">
  <button id="prev" type="button">Atrás</button>
  <button id="next" type="button">Siguiente</button>
  <button id="replay" type="button">Repetir</button>
</div>
<script>
/* ============ núcleo compartido ============ */
const NS='http://www.w3.org/2000/svg';
const deck=document.getElementById('deck');
const W=1000,H=562;

function el(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  if(attrs) for(const k in attrs) n.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function txt(parent,cls,x,y,s,extra){
  const t=el('text',Object.assign({class:cls,x:x,y:y},extra||{}),parent);
  t.textContent=s; return t;
}
const seeded=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const stagger=(nodes,step,start)=>nodes.forEach((n,i)=>n.style.transitionDelay=((start||0)+i*step).toFixed(2)+'s');
const on=(n,v)=>n.classList.toggle('on',!!v);
function shuffled(n,rnd){
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* fondo: aire, piso con grano y viñeteado */
function background(svg,i,opts){
  opts=opts||{};
  const G=opts.ground||444;
  const d=el('defs',null,svg), p='g'+i;
  const air=el('linearGradient',{id:p+'air',x1:0,y1:0,x2:0,y2:1},d);
  el('stop',{offset:0,'stop-color':opts.dark?'#0C1828':'#122238'},air);
  el('stop',{offset:1,'stop-color':'#0A1420'},air);
  const so=el('linearGradient',{id:p+'soil',x1:0,y1:0,x2:0,y2:1},d);
  el('stop',{offset:0,'stop-color':opts.dark?'#141C2A':'#1C2637'},so);
  el('stop',{offset:1,'stop-color':'#0C1420'},so);
  const bm=el('linearGradient',{id:p+'beam',x1:0,y1:0,x2:1,y2:0},d);
  el('stop',{offset:0,'stop-color':'#F5A524','stop-opacity':.30},bm);
  el('stop',{offset:1,'stop-color':'#F5A524','stop-opacity':0},bm);
  const vg=el('radialGradient',{id:p+'vig',cx:.5,cy:.45,r:.78},d);
  el('stop',{offset:.55,'stop-color':'#000','stop-opacity':0},vg);
  el('stop',{offset:1,'stop-color':'#000','stop-opacity':.5},vg);

  el('rect',{x:0,y:0,width:W,height:G,fill:'url(#'+p+'air)'},svg);
  el('rect',{x:0,y:G,width:W,height:H-G,fill:'url(#'+p+'soil)'},svg);
  if(!opts.flat){
    el('path',{d:'M0,'+(G-36)+' H1000 M0,'+(G-20)+' H1000',stroke:'#16263C','stroke-width':1,opacity:.65},svg);
    if(opts.grain!==false){
      const g=el('g',{opacity:.4},svg), r=seeded(7+i*13);
      for(let k=0;k<120;k++) el('ellipse',{cx:r()*W,cy:G+4+r()*(H-G-6),rx:.6+r()*1.7,ry:.5+r()*1,
        fill:r()>.5?'#31445F':'#0A1220'},g);
    }
    el('path',{d:'M0,'+G+' H1000',stroke:'#2A3C58','stroke-width':1,opacity:.7},svg);
  }
  return p;
}
const vignette=(svg,p)=>el('rect',{x:0,y:0,width:W,height:H,fill:'url(#'+p+'vig)','pointer-events':'none'},svg);

/* término, palabra clave, marcas de avance y paginador */
function chrome(svg,cfg,idx,total){
  txt(svg,'sup',34,52,cfg.sup);
  txt(svg,'term',34,96,cfg.term);
  el('line',{class:'term-rule',x1:36,y1:114,x2:122,y2:114},svg);
  const kw=txt(svg,'kw',34,530,'');
  const ticks=cfg.kws.map((_,i)=>el('rect',{class:'tick',x:898+i*22,y:524,width:14,height:2.5,rx:1},svg));
  txt(svg,'pager',966,52,String(idx+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'),{'text-anchor':'end'});
  return function(beat){
    kw.classList.remove('on'); kw.getBoundingClientRect();
    kw.textContent=cfg.kws[beat];
    requestAnimationFrame(()=>kw.classList.add('on'));
    ticks.forEach((t,i)=>on(t,i<=beat));
  };
}

/* investigador reutilizable */
function makeSci(parent,x,base,tool,scale){
  const s=scale||1;
  const g=el('g',{class:'sci',transform:'translate('+x+','+base+') scale('+s+')'},parent);
  el('ellipse',{class:'shade',cx:0,cy:4,rx:26,ry:6},g);
  const legL=el('g',{class:'legL'},g); el('path',{class:'ink',d:'M-6,-52 L-12,-2'},legL);
  const legR=el('g',{class:'legR'},g); el('path',{class:'ink',d:'M6,-52 L12,-2'},legR);
  const torso=el('g',{class:'torso'},g);
  el('path',{class:'coat',d:'M-20,-50 L-15,-104 L15,-104 L20,-50 Z'},torso);
  const af=el('g',{class:'armFree'},torso); el('path',{class:'ink',d:'M-14,-97 L-32,-64'},af);
  el('circle',{cx:0,cy:-122,r:14,fill:'#16243A',stroke:'var(--cream)','stroke-width':2.4},torso);
  el('path',{d:'M-14,-126 a14,14 0 0 1 28,0 l4,-9 a18,18 0 0 0 -36,0 Z',fill:'var(--cream)'},torso);
  const armTool=el('g',{class:'armTool'},torso);
  el('path',{class:'ink',d:'M14,-97 L34,-70'},armTool);
  const toolG=el('g',{class:'toolG',transform:'translate(34,-70)'},armTool);
  if(tool==='libreta'){
    el('rect',{class:'tool',x:-4,y:-12,width:26,height:30,rx:2},toolG);
    for(let k=0;k<4;k++) el('line',{x1:1,y1:-5+k*8,x2:17,y2:-5+k*8,stroke:'var(--slate)','stroke-width':1.4},toolG);
    el('path',{class:'ink',style:'stroke:var(--amber)',d:'M24,-16 L34,-26'},toolG);
  }else if(tool==='cron'){
    el('circle',{class:'tool',cx:8,cy:0,r:13},toolG);
    el('path',{class:'ink',style:'stroke:var(--amber)',d:'M8,-13 v-5 M2,-18 h12'},toolG);
    const nd=el('g',{class:'spin',style:'transform-origin:8px 0px'},toolG);
    el('line',{x1:8,y1:0,x2:8,y2:-9,stroke:'var(--amber)','stroke-width':1.8,'stroke-linecap':'round'},nd);
  }else if(tool==='hoja'){
    el('rect',{class:'tool',x:-2,y:-14,width:24,height:32,rx:2},toolG);
    for(let k=0;k<4;k++) el('line',{x1:3,y1:-7+k*8,x2:17,y2:-7+k*8,stroke:'var(--slate)','stroke-width':1.4},toolG);
  }
  return {g,torso,armTool,toolG,
    moveTo(nx,dur){
      g.style.transitionDuration=dur+'s';
      g.setAttribute('transform','translate('+nx+','+base+') scale('+s+')');
    },
    walk(flag,ms){
      clearTimeout(this._t);
      if(flag){g.classList.add('walking'); this._t=setTimeout(()=>g.classList.remove('walking'),ms);}
      else g.classList.remove('walking');
    }};
}

/* celular sobre el pupitre: apagado, encendido con avisos, o guardado */
function makePhone(parent,x,y){
  const g=el('g',{transform:'translate('+x+','+y+')'},parent);
  el('rect',{x:-5.5,y:-10,width:11,height:20,rx:2.5,fill:'#16243A',stroke:'var(--amber)','stroke-width':1.6},g);
  const scr=el('rect',{x:-3.5,y:-7.5,width:7,height:15,rx:1,fill:'var(--amber)'},g);
  scr.style.opacity=.14;
  const pings=el('g',{class:'fade'},g);
  for(let i=0;i<3;i++){
    const c=el('circle',{class:'ping',cx:0,cy:-9,r:2.4,fill:'var(--amber)'},pings);
    c.style.animationDelay=(i*.8).toFixed(2)+'s';
  }
  const cross=el('g',{class:'fade'},g);
  el('path',{class:'blocked',d:'M-11,-15 L11,15 M11,-15 L-11,15'},cross);
  return {g,scr,pings,cross,
    set(state){                              /* 'idle' | 'on' | 'off' */
      scr.classList.toggle('glow',state==='on');
      if(state!=='on') scr.style.opacity=(state==='off'?.05:.14);
      g.style.opacity=(state==='off'?.4:1);  /* guardado: se apaga y se aparta */
      on(pings,state==='on');
      on(cross,state==='off');
    }};
}

/* estudiante sentado ante su pupitre */
function makeStudent(parent,x,base,opts){
  opts=opts||{};
  const s=opts.scale||1;
  const g=el('g',{class:'stu',transform:'translate('+x+','+base+') scale('+s+')'},parent);
  el('ellipse',{class:'shade',cx:0,cy:4,rx:30,ry:6},g);
  const torso=el('g',{class:'torso'},g);
  el('path',{class:'coat',d:'M-15,-42 L-12,-78 L12,-78 L15,-42 Z'},torso);
  el('path',{class:'ink',d:'M-12,-72 L-22,-46'},torso);
  el('path',{class:'ink',d:'M12,-72 L19,-47'},torso);
  el('circle',{cx:0,cy:-92,r:12.5,fill:'#16243A',stroke:'var(--cream)','stroke-width':2.4},torso);
  el('path',{d:'M-12.5,-96 a12.5,12.5 0 0 1 25,0 l3.5,-8 a16,16 0 0 0 -32,0 Z',fill:'var(--cream)'},torso);
  el('path',{class:'deskleg',d:'M-26,-33 V0 M26,-33 V0'},g);
  el('rect',{class:'desk',x:-32,y:-40,width:64,height:7,rx:2},g);
  el('rect',{class:'sheet',x:-24,y:-47,width:26,height:7,rx:1},g);
  const quiz=el('g',{class:'fade'},g);
  el('rect',{class:'sheetHot',x:-24,y:-47,width:26,height:7,rx:1},quiz);
  const phone=opts.phone?makePhone(g,26,-51):null;
  const att=el('g',{class:'fade',transform:'translate(0,-134)'},g);
  el('rect',{class:'meter',x:-15,y:-3,width:30,height:6,rx:3},att);
  const fill=el('rect',{class:'meterFill',x:-15,y:-3,width:30,height:6,rx:3},att);
  const stake=el('g',{class:'fade',transform:'translate(0,-136)'},g);
  el('line',{x1:0,y1:2,x2:0,y2:26,stroke:'#3A4E6B','stroke-width':1.6},stake);
  const flag=el('rect',{x:-9,y:-9,width:18,height:12,rx:1.5,fill:'var(--slate)',opacity:.9},stake);
  return {g,torso,phone,quiz,att,stake,
    setAttention(v){
      fill.style.transform='scaleX('+v+')';
      fill.style.fill=v<.55?'var(--amber)':'var(--leaf)';
    },
    setGroup(t){flag.setAttribute('fill',t?'var(--amber)':'var(--slate)');},
    moveTo(nx,dur){
      g.style.transitionDuration=(dur||3)+'s';
      g.setAttribute('transform','translate('+nx+','+base+') scale('+s+')');
    }};
}

/* corchete con Δ entre dos alturas */
function makeDelta(parent){
  const g=el('g',{class:'fade'},parent);
  const brk=el('path',{class:'bracket'},g);
  const t=txt(g,'dlt',0,0,'Δ');
  return {g,
    set(x,yA,yB,label){
      brk.setAttribute('d','M'+x+','+yA+' h9 M'+(x+9)+','+yA+' V'+yB+' M'+x+','+yB+' h9');
      t.setAttribute('x',x+18);
      t.setAttribute('y',((yA+yB)/2+7).toFixed(0));
      t.textContent=label;
    }};
}

/* tarjeta de texto */
function makeCard(parent,x,y,w,title,lines){
  const h=44+lines.length*26;
  const g=el('g',{class:'fade'},parent);
  el('rect',{class:'panel',x:x,y:y,width:w,height:h,rx:3},g);
  if(title) txt(g,'tag hot',x+18,y+26,title);
  lines.forEach((s,i)=>txt(g,'line',x+18,y+58+i*26,s));
  return {g,h};
}

/* ============ 01 · OBSERVACIÓN ============ */
function slideObservacion(svg,idx,total){
  const p=background(svg,idx,{ground:474,grain:false});
  const BASE=474, XS=[286,370,454,538,622,706];
  const PHONE=[true,false,true,true,false,false];
  const INT=[8,2,6,9,3,1];

  el('line',{x1:206,y1:158,x2:206,y2:508,stroke:'#1D3049','stroke-width':1.5,'stroke-dasharray':'5 10'},svg);
  txt(svg,'tag',194,322,'observo',{'text-anchor':'middle',transform:'rotate(-90 194 322)'});
  txt(svg,'tag',248,180,'sala de estudio · 20 minutos');

  const sci=makeSci(svg,116,BASE,'libreta');
  const students=XS.map((x,i)=>makeStudent(svg,x,BASE,{scale:.92,phone:PHONE[i]}));

  const sweep=el('g',{class:'fade'},svg);
  const sl=el('rect',{x:246,y:336,width:18,height:164,rx:2,fill:'none',
    stroke:'var(--amber)','stroke-width':1.6,opacity:.85},sweep);
  sl.classList.add('scan'); sl.style.setProperty('--tx','482px');

  const medidor=el('g',{class:'fade'},svg);
  txt(medidor,'tag',258,332,'atención');

  const panel=el('g',{class:'fade'},svg);
  el('rect',{class:'panel',x:752,y:168,width:212,height:252,rx:3},panel);
  txt(panel,'tag',768,196,'registro');
  txt(panel,'tag',768,216,'interrupciones / 20 min',{style:'font-size:9px;letter-spacing:.16em'});
  const ORD=[3,0,2,4,1,5];
  const rows=XS.map((_,i)=>{
    const g=el('g',{class:'mov2',transform:'translate(0,'+(250+i*27)+')'},panel);
    txt(g,'val',768,4,'E'+(i+1));

  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.svg.classList.toggle('active',k===cur));
  slides[cur].beat=beat===undefined?0:Math.max(0,Math.min(BEATS-1,beat));
  slides[cur].render(slides[cur].beat);
}
function next(){
  const s=slides[cur];
  if(s.beat<BEATS-1){s.beat++;s.render(s.beat);}
  else if(cur<slides.length-1) show(cur+1,0);
}
function back(){
  const s=slides[cur];
  if(s.beat>0){s.beat--;s.render(s.beat);}
  else if(cur>0) show(cur-1,BEATS-1);
}
document.getElementById('next').onclick=e=>{e.stopPropagation();next();};
document.getElementById('prev').onclick=e=>{e.stopPropagation();back();};
document.getElementById('replay').onclick=e=>{e.stopPropagation();show(cur,0);};
deck.onclick=next;
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();back();}
  else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();show(cur+1,0);}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();show(cur-1,0);}
  else if(e.key==='r'||e.key==='R'){show(cur,0);}
  else if(/^[1-6]$/.test(e.key)) show(+e.key-1,0);
});
let uiT;
const showUI=()=>{document.body.classList.add('show-ui');clearTimeout(uiT);
  uiT=setTimeout(()=>document.body.classList.remove('show-ui'),2600);};
addEventListener('pointermove',showUI); addEventListener('focusin',showUI);
show(0,0);
</script>
